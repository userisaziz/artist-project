# Backend lint gate (rules: .qoder/rules/fastapi-best-practices.md — "Lint").
# Both `ruff check .` and `ruff format --check .` must pass before every commit (pre-commit + CI).

line-length = 120

[lint]
# S: security (bandit), ASYNC: blocking calls in async code, UP: modern syntax, SIM: simplifications.
select = ["E4", "E7", "E9", "F", "B", "I", "RUF", "S", "ASYNC", "UP", "SIM"]
# Typographic punctuation deliberately used in prose comments/docstrings.
allowed-confusables = ["›", "–"]

[lint.flake8-bugbear]
# FastAPI idiom: Depends()/Query()/Body() as argument defaults are not bugs.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Form",
  "fastapi.File",
]

[lint.per-file-ignores]
# __mapper_args__/__table_args__ dicts are SQLAlchemy declarative idiom, not shared mutable state.
"*/models.py" = ["RUF012"]
"*/config.py" = ["RUF012"]  # pydantic copies field defaults per instance
"tests/conftest.py" = ["E402"]  # test env vars must be set before the app is imported
# pytest asserts, and throwaway secrets that only exist inside tests.
"tests/**" = ["S101", "S105", "S106"]
