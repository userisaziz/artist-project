# Local production-like stack: Postgres + the API image.  docker compose up --build
# The API reads backend/.env for secrets; ENVIRONMENT stays local here so fake storage and console SMS work.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: art_circle
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/art_circle
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/art_circle
    ports: ["8001:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
