# Render Blueprint: the API as a Docker web service (staging). Secrets marked sync: false are entered in the
# Render dashboard when the Blueprint is applied; nothing secret lives in this file.
services:
  - type: web
    # Must stay in sync with the URL used everywhere else (mobile/.env.production, keep-warm.yml,
    # admin/vercel.json): the service name sets the onrender.com subdomain.
    name: artist-project
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio # next to the Neon database (us-east-2)
    healthCheckPath: /health/live
    # The free plan has no pre-deploy step, so migrations run before the server starts (they are idempotent).
    dockerCommand: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
      --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 20 --no-server-header"
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://USER:PASSWORD@HOST/DB[?ssl=require]
        # The pooler host (-pooler.c-6...) is what staging runs on and boots fine, verified
        # 2026-10-30. Strip Neon's libpq params: sslmode/channel_binding make asyncpg raise
        # TypeError before uvicorn binds, so the service hangs with no HTTP response at all.
      - key: JWT_SECRET
        generateValue: true
      - key: AADHAAR_ENCRYPTION_KEY
        sync: false # Fernet key; keep a backup
      - key: CORS_ORIGINS
        sync: false # JSON list, e.g. ["https://art-circle-admin.vercel.app"]
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SMS_PROVIDER
        value: console
      - key: DEV_OTP_CODE
        value: "123456"
      - key: STORAGE_PROVIDER
        value: r2 # fake hands clients upload tickets for the unroutable placeholder fake.storage, so client uploads always fail; dev uses the real R2 buckets (values in backend/.env.dev)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false # public images (getready-dev)
      - key: R2_PRIVATE_BUCKET
        sync: false # identity documents (getready-dev-private); must differ from R2_BUCKET
      - key: R2_PUBLIC_URL
        sync: false # the public bucket's r2.dev address
      - key: PUSH_PROVIDER
        value: expo
      - key: PAYMENT_PROVIDER
        value: direct
      - key: GEOCODER_PROVIDER
        value: geoapify
      - key: GEOCODER_API_KEY
        sync: false # Geoapify key for area search; server-side only
      - key: WEB_CONCURRENCY
        value: "1"
