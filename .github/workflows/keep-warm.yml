name: keep-warm

# Render's free plan puts the staging API to sleep after 15 idle minutes, and the first request after that waits
# 30-60 s for it to boot (plus migrations). A ping every 10 minutes keeps it awake; one service stays inside the
# free plan's monthly hours. Schedules run from the default branch only, and GitHub pauses them after 60 days
# without repo activity (re-enable from the Actions tab).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the staging API
        # Long timeout: a ping that lands on a sleeping instance is the one that wakes it.
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://artist-project.onrender.com/health/live
