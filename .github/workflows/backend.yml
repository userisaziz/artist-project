name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.14"
  # CI-only throwaway values; real secrets never live in the repo.
  JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
  AADHAAR_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/art_circle
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/art_circle_test
  ENVIRONMENT: test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements*.* }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Known vulnerabilities in locked dependencies
        run: pip-audit -r requirements.lock --progress-spinner off

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: art_circle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements*.* }
      - run: pip install -r requirements-dev.txt
      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE art_circle_test"
      - name: Migrations build an empty database, match the models, and reverse cleanly
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests with coverage gate
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Housekeeping script runs against a real database
        run: python -m scripts.maintenance

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: art_circle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t art-circle-api:${{ github.sha }} .
      - name: Smoke test - migrate, boot, readiness
        run: |
          ENV_ARGS="--network host -e ENVIRONMENT=staging -e DATABASE_URL -e JWT_SECRET -e AADHAAR_ENCRYPTION_KEY
            -e SMS_PROVIDER=console -e STORAGE_PROVIDER=fake -e PAYMENT_PROVIDER=direct"
          docker run --rm $ENV_ARGS art-circle-api:${{ github.sha }} alembic upgrade head
          docker run -d --name api $ENV_ARGS art-circle-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: The image refuses an unsafe production config
        run: |
          if docker run --rm --network host -e ENVIRONMENT=production -e DATABASE_URL -e JWT_SECRET \
               -e AADHAAR_ENCRYPTION_KEY -e SMS_PROVIDER=console art-circle-api:${{ github.sha }} \
               python -c "from app.main import create_app; create_app()"; then
            echo "production booted with console SMS"; exit 1
          fi
